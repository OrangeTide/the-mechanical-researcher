name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lowdown zip
          # For topics that ship a browser demonstration: clang supplies the
          # wasm32 target and the RISC-V cross-compiler builds the guest.
          # build.sh skips such a demo rather than failing if these are
          # absent, so they are only needed to publish it.
          sudo apt-get install -y clang gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Build site
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
